name: Build and test

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout repository with drawio submodule
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json

      - name: Install root & agent dependencies
        run: |
          npm ci
          npm --prefix agent ci

      - name: Typecheck agent
        run: npm run typecheck:agent

      - name: Build agent bundles & patch drawio hook
        run: npm run build:agent

      - name: Run tests
        run: npm test
