name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0; optional, defaults to package.json version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-15
    steps:
      - name: Checkout repository with drawio submodule
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag=$(node -p "'v' + require('./package.json').version")
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Expected tag $expected_tag, got $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix agent ci

      - name: Check source
        run: |
          npm run typecheck:agent
          npm test

      - name: Package macOS arm64
        run: npm run release:mac:arm64

      - name: Check packaged app startup
        run: |
          set -o pipefail
          profile=$(mktemp -d)
          expected=$(node -p "require('./package.json').version")
          actual=$(dist/mac-arm64/DioSidecar.app/Contents/MacOS/DioSidecar --user-data-dir="$profile" --version | tail -n 1)
          test "$actual" = "$expected"

      - name: Archive corresponding source
        run: |
          set -o pipefail
          version=$(node -p "require('./package.json').version")
          archive_root="diosidecar-$version"
          archive_dir=$(mktemp -d)
          mkdir -p "$archive_dir/$archive_root/drawio"
          git archive HEAD | tar -xf - -C "$archive_dir/$archive_root"
          git -C drawio archive HEAD | tar -xf - -C "$archive_dir/$archive_root/drawio"
          tar -czf "dist/$archive_root-source.tar.gz" -C "$archive_dir" "$archive_root"

      - name: Upload macOS preview files
        uses: actions/upload-artifact@v4
        with:
          name: diosidecar-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-source.tar.gz
          if-no-files-found: error

  build-win:
    name: Build Windows
    runs-on: windows-2025
    steps:
      - name: Checkout repository with drawio submodule
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install desktop dependencies
        run: npm ci

      - name: Install Agent dependencies
        run: npm --prefix agent ci

      - name: Typecheck Agent
        run: npm run typecheck:agent

      - name: Package Windows x64
        run: npm run release:win

      - name: Check preview files
        run: |
          foreach ($pattern in @('*.exe', '*.zip')) {
            if (!(Get-ChildItem -LiteralPath dist -Filter $pattern -File)) {
              throw "Expected a $pattern preview file in dist"
            }
          }

      - name: Upload Windows preview files
        uses: actions/upload-artifact@v4
        with:
          name: diosidecar-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish Draft Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Determine tag name
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Inspect and generate unified checksums
        working-directory: release-assets
        run: |
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DioSidecar ${{ steps.meta.outputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          body: |
            This release includes automated desktop preview packages for macOS (Apple Silicon) and Windows (x64).
            Automated builds are not signed or notarized.

            The `-source.tar.gz` archive includes the pinned draw.io editor sources, build scripts and license notices.

            Verify your downloads against `SHA256SUMS.txt`.
          files: release-assets/*
