name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (optional, defaults to v followed by the package.json version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          commit=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Expected tag $tag, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [[ -n "$INPUT_TAG" && "$INPUT_TAG" != "$tag" ]]; then
            echo "Expected tag $tag, got $INPUT_TAG" >&2
            exit 1
          fi
          if tagged_commit=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}"); then
            if [[ "$tagged_commit" != "$commit" ]]; then
              echo "Tag $tag already points to $tagged_commit instead of $commit" >&2
              exit 1
            fi
          fi
          printf 'version=%s\ntag=%s\ncommit=%s\n' "$version" "$tag" "$commit" >> "$GITHUB_OUTPUT"

  build-mac:
    name: Build macOS arm64
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository with drawio submodule
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix agent ci

      - name: Check source
        run: |
          npm run typecheck:agent
          npm test

      - name: Package macOS arm64
        run: npm run release:mac:arm64

      - name: Verify macOS packages and normal app quit
        timeout-minutes: 5
        run: |
          hdiutil verify "dist/diosidecar-$VERSION-mac-arm64.dmg"
          node .github/scripts/smoke-mac.mjs "dist/diosidecar-$VERSION-mac-arm64.zip" "$VERSION"

      - name: Archive corresponding source
        shell: bash
        run: |
          archive_root="diosidecar-$VERSION"
          archive_dir=$(mktemp -d)
          trap 'rm -rf "$archive_dir"' EXIT
          mkdir -p "$archive_dir/$archive_root/drawio"
          drawio_commit=$(git rev-parse HEAD:drawio)
          git archive HEAD | tar -xf - -C "$archive_dir/$archive_root"
          git -C drawio archive "$drawio_commit" | tar -xf - -C "$archive_dir/$archive_root/drawio"
          tar -czf "dist/$archive_root-source.tar.gz" -C "$archive_dir" "$archive_root"

      - name: Upload macOS preview files
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: diosidecar-macos-arm64
          path: |
            dist/diosidecar-${{ env.VERSION }}-mac-arm64.dmg
            dist/diosidecar-${{ env.VERSION }}-mac-arm64.zip
            dist/diosidecar-${{ env.VERSION }}-source.tar.gz
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  build-win:
    name: Build Windows x64
    needs: metadata
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository with drawio submodule
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          submodules: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install Agent dependencies
        run: npm --prefix agent ci

      - name: Typecheck Agent
        run: npm run typecheck:agent

      - name: Package Windows x64
        run: npm run release:win

      - name: Check preview files
        run: |
          foreach ($extension in @('exe', 'zip')) {
            $path = "dist/diosidecar-${env:VERSION}-win-x64.$extension"
            if (!(Test-Path -LiteralPath $path -PathType Leaf) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Missing or empty preview file $path"
            }
          }

      - name: Upload Windows preview files
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: diosidecar-windows-x64
          path: |
            dist/diosidecar-${{ env.VERSION }}-win-x64.exe
            dist/diosidecar-${{ env.VERSION }}-win-x64.zip
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  publish:
    name: Create draft release
    needs: [metadata, build-mac, build-win]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download macOS and Windows artifacts
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-mac.outputs.artifact }},${{ needs.build-win.outputs.artifact }}
          path: release-assets
          merge-multiple: true

      - name: Verify release files and generate checksums
        working-directory: release-assets
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          base="diosidecar-$VERSION"
          files=("$base-mac-arm64.dmg" "$base-mac-arm64.zip" "$base-source.tar.gz" "$base-win-x64.exe" "$base-win-x64.zip")
          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Missing or empty release file $file" >&2
              exit 1
            fi
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          target_commitish: ${{ needs.metadata.outputs.commit }}
          name: DioSidecar ${{ needs.metadata.outputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            This release includes automated desktop preview packages for macOS (Apple Silicon) and Windows (x64).
            Automated builds are not signed or notarized.

            The `-source.tar.gz` archive includes the pinned draw.io editor sources, build scripts and license notices.

            Verify your downloads against `SHA256SUMS.txt`.
          files: release-assets/*
