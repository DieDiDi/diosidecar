name: Attach Windows packages to draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, for example v0.1.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: attach-windows-release-${{ inputs.tag }}

jobs:
  attach:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Download Windows preview for the tagged commit
        shell: bash
        run: |
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/windows-preview.yml/runs" \
            -f status=success -f head_sha="$(git rev-parse HEAD)" --jq '.workflow_runs[0].id // empty')
          if [[ -z "$run_id" ]]; then
            echo "No successful Windows preview was found for the commit tagged $RELEASE_TAG." >&2
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name diosidecar-windows-x64-preview --dir "$RUNNER_TEMP/windows-preview"

      - name: Attach Windows packages and checksums to the draft
        shell: bash
        working-directory: ${{ runner.temp }}/windows-preview
        run: |
          shopt -s nullglob
          installers=(*.exe)
          archives=(*.zip)
          if (( ${#installers[@]} != 1 || ${#archives[@]} != 1 )); then
            echo 'Expected one Windows installer and one Windows ZIP.' >&2
            exit 1
          fi

          checksum_file=SHA256SUMS-windows-x64.txt
          sha256sum -- "${installers[@]}" "${archives[@]}" > "$checksum_file"

          release=$(gh release view --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft,url -- "$RELEASE_TAG")
          if [[ $(jq -r '.isDraft' <<< "$release") != true ]]; then
            echo "Release $RELEASE_TAG must be a draft." >&2
            exit 1
          fi
          release_id=$(jq -r '.databaseId' <<< "$release")
          existing_assets=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" | jq 'add')

          pending=()
          for file in "${installers[@]}" "${archives[@]}" "$checksum_file"; do
            existing_digest=$(jq -r --arg name "$file" '.[] | select(.name == $name) | .digest // "unavailable"' <<< "$existing_assets")
            if [[ -z "$existing_digest" ]]; then
              pending+=("$file")
              continue
            fi
            local_checksum=$(sha256sum -- "$file")
            if [[ "$existing_digest" != "sha256:${local_checksum%% *}" ]]; then
              echo "Draft already contains $file with different or unverified contents." >&2
              exit 1
            fi
          done

          if (( ${#pending[@]} )); then
            gh release upload --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" "${pending[@]}"
          fi
          echo "[Open the release draft]($(jq -r '.url' <<< "$release"))" >> "$GITHUB_STEP_SUMMARY"
